    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = false;
          if (saved) {
            isDark = saved === 'dark';
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            var metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
              metaThemeColor.setAttribute('content', '#0f0f11');
            }
          }
        } catch (e) {}
